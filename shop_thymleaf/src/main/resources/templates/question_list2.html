<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">
<h2>질문 게시판</h2>

<a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
<p></p>

<table class="table">
	<thead class="table-dark">
		<tr>
			<th>번호</th>
			<th>제목</th>
			<th>작성일시</th>
		</tr>
	</thead>
	<tbody>
		<tr th:each = "question, loop : ${paging}" >
			<td th:text="${loop.count}"></td>
			<td >
				<a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}">db에서 출력 부분</a>
			</td>
			<td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"> db에서 출력 부분 - 작성날짜 </td>
		</tr>
	</tbody>
</table>

<!-- 페이징처리 시작 -->
<div th:if="${!paging.isEmpty()}">
    <ul class="pagination justify-content-center">

        <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
            <a class="page-link"
                th:href="@{|?page=${paging.number-1}|}">
                <span>이전</span>
            </a>
        </li>
		
		
		
		
		<li th:each="page: ${#numbers.sequence(0, paging.totalPages-1)}"
		    th:if="(${paging.number} == 0 and page <= 2)
		           or
		           (${paging.number} == 1 and page <= 2)
		           or
				   (${paging.number} >= ${paging.totalPages-3} and page >= ${paging.totalPages-4})
				   or
		           (${paging.number} >= ${paging.totalPages-2} and page >= ${paging.totalPages-3})
		           or
		           (page >= ${paging.number}-1 and page <= ${paging.number}+1 and ${paging.number} > 1 and ${paging.number} < ${paging.totalPages-2})"
		    th:classappend="${page == paging.number} ? 'active'"
		    class="page-item">
		    <a th:text="${page}" class="page-link" th:href="@{|?page=${page}|}"></a>
		</li>


		
		
		
		

        

		
		
		
		
		
		
        <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
            <a class="page-link" th:href="@{|?page=${paging.number+1}|}">
                <span>다음</span>
            </a>
        </li>

    </ul>
</div>







</div>
</html>
